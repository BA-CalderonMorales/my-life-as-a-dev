# ==============================================================================
# FEATURE TOGGLES
# ==============================================================================
# Durable, config-driven feature switches for the rendered site.
#
# Every capability below can be re-enabled later WITHOUT resurrecting dead
# code: the implementation (chat widget, version selector, creative canvas,
# tab content) is preserved on disk and simply gated by these flags in the
# build/overrides.
#
# DEFAULT STATE (slim, presentation-focused site):
#   - Ask AI assistant ........ OFF
#   - Version selector ......... OFF
#   - All top-level tabs ....... OFF except the landing page (Home)
#   - Creative canvas hero ..... OFF (static editorial Home treatment)
#
# How to flip a feature back on:
#   1. Set the flag below to `true`.
#   2. Regenerate: uv run python scripts/python/merge_zensical_config.py
#   3. Rebuild: make build
#
# Off-section content (Learning, Docs-as-Code, Projects, Canvas, About Me):
#   The source files are PRESERVED on disk under docs-archive/<section>/ and
#   are excluded from the build, nav drawer, and search. They are not deleted.
#   The tab flags below still gate the visible tab bar and hamburger drawer so
#   the navigation stays consistent if a section is restored.
#
# To fully re-enable a section:
#   1. Move it back:   git mv docs-archive/<section> docs/<section>
#   2. Restore its nav entry from docs-archive/03-navigation-full.toml
#   3. Set its tab flag to `true` below
#   4. Regenerate and rebuild
#
# Notes:
#   - The chat widget CSS is loaded from docs/overrides/main.html (gated by
#     chat_assistant); when OFF it is not linked or loaded.
#   - The version selector is injected from main.html + header.html (gated by
#     version_selector). The native mike provider in mkdocs.yml is disabled so
#     no version dropdown renders. To use the native selector instead, set
#     `provider = "mike"` in mkdocs.yml's `extra.version` block.
#   - Tabs and the hamburger drawer are filtered in docs/overrides/partials/
#     tabs.html and nav.html using the map below. Only tabs set to `true`
#     render; off sections are also archived (see above) so they are absent
#     from the built site and search index.
# ==============================================================================

[project.extra.features]
# AI chat assistant ("Ask AI"). When false, no trigger/modal/scripts load.
chat_assistant = false
# Version selector dropdown in the header. When false, no selector renders.
version_selector = false
# Generative "creative canvas" hero on the landing page. The portfolio uses a
# static editorial treatment so the content remains quiet and dependable.
creative_canvas = false

# Per-tab visibility. Keys are derived from each top-level nav title:
# lowercased, spaces/dashes/dots replaced with underscores.
# Only `home` is enabled by default so the landing page is the sole tab.
[project.extra.features.tabs]
home = true
learning = false
docs_as_code = false
projects = false
canvas = false
about_me = false
