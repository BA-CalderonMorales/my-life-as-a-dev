# ==============================================================================
# THEME BASICS
# ==============================================================================
# Stock Zensical theme. Playpen Sans carries the handwritten voice
# (light, per the author); JetBrains Mono keeps code legible. Courier
# Prime remains the fallback if Playpen Sans fails to load.
# ==============================================================================

[project.theme]
favicon = "assets/images/favicon/favicon.ico"
language = "en"

features = [
    "content.code.annotate",
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.top",
]

[project.theme.font]
text = "Playpen Sans"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "black"
accent = "grey"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "grey"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/BA-CalderonMorales/my-life-as-a-dev"
