# ==============================================================================
# THEME BASICS
# ==============================================================================
# Core theme settings including branding, language, and template overrides.
# ==============================================================================

[project.theme]
custom_dir = "docs/overrides"
logo = "assets/images/me-today.png"
favicon = "assets/images/favicon/favicon.ico"
language = "en"


# ==============================================================================
# THEME FEATURES
# ==============================================================================
# Toggle-able capabilities organized by category.
# Comment out any you don't need to improve performance.
# ==============================================================================

features = [
    # Announcement Bar
    "announce.dismiss",

    # Code Block Enhancements
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",

    # Content Actions & Tooltips
    "content.action.edit",
    "content.action.view",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",

    # Navigation Behavior
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    # "navigation.sections",  # Disabled: keeps nav collapsed by default
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",

    # Search Enhancements
    "search.highlight",
    "search.suggest",
    "search.share",

    # Table of Contents
    "toc.follow",
]


# ==============================================================================
# TYPOGRAPHY
# ==============================================================================

[project.theme.font]
text = "Space Grotesk"
code = "Fira Code"


# ==============================================================================
# ICONS
# ==============================================================================

[project.theme.icon]
repo = "fontawesome/brands/github"

# Tag icons - associate tag identifiers with icons
[project.theme.icon.tag]
default = "lucide/hash"
python = "fontawesome/brands/python"
rust = "fontawesome/brands/rust"
javascript = "fontawesome/brands/js"
typescript = "simple/typescript"
html = "fontawesome/brands/html5"
css = "fontawesome/brands/css3"
react = "fontawesome/brands/react"
algorithm = "lucide/binary"
data-structure = "lucide/network"
setup = "lucide/settings"
tutorial = "lucide/graduation-cap"
project = "lucide/folder-code"
cloud = "lucide/cloud"
ai = "lucide/brain"
learning = "lucide/book-open"
interview = "lucide/mic"
system-design = "lucide/server"
security = "lucide/shield"
workflow = "lucide/git-branch"
documentation = "lucide/file-text"
webgl = "lucide/box"
experiment = "lucide/flask-conical"
devops = "lucide/container"
networking = "lucide/wifi"
distributed = "lucide/network"


# ==============================================================================
# COLOR SCHEMES
# ==============================================================================
# Dark mode is listed first, making it the default.
# Users can toggle between schemes using the sun/moon icons.
# ==============================================================================

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"


# ==============================================================================
# TAG IDENTIFIERS
# ==============================================================================
# Map tag names to identifiers for icon association.
# Tags not listed here will use the default icon.
# ==============================================================================

[project.extra.tags]
Python = "python"
Rust = "rust"
JavaScript = "javascript"
TypeScript = "typescript"
HTML5 = "html"
CSS = "css"
React = "react"
Algorithms = "algorithm"
"Data Structures" = "data-structure"
Setup = "setup"
Tutorial = "tutorial"
Project = "project"
Cloud = "cloud"
AI = "ai"
Learning = "learning"
Interview = "interview"
"System Design" = "system-design"
Security = "security"
Workflow = "workflow"
Documentation = "documentation"
WebGL = "webgl"
Experiment = "experiment"
DevOps = "devops"
Networking = "networking"
"Distributed Systems" = "distributed"


# ==============================================================================
# SOCIAL LINKS
# ==============================================================================
# Icons displayed in the footer linking to external profiles.
# ==============================================================================

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/BA-CalderonMorales/my-life-as-a-dev"
