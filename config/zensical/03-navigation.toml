# ==============================================================================
# NAVIGATION STRUCTURE
# =============================================================================
# The site is currently slimmed to a single presentation landing page (Home).
# All other top-level sections are archived under docs-archive/ (source files
# preserved on disk) and gated off via feature flags in 08-features.toml.
#
# To re-enable a section:
#   1. Move its directory back: git mv docs-archive/<section> docs/<section>
#   2. Restore its nav entry from docs-archive/03-navigation-full.toml
#   3. Set its tab flag to `true` in 08-features.toml
#   4. Regenerate and rebuild
# ==============================================================================

[project]
nav = [
    { "Home" = "index.md" },
]
