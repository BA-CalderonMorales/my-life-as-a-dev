# ----------------------------------------------------------------------------
# Theme configuration
# ----------------------------------------------------------------------------
[project.theme]

# Use classic variant for Material for MkDocs look (optional)
# variant = "classic"

# Custom template overrides
custom_dir = "docs/overrides"

# Logo and favicon
logo = "assets/images/me-today.png"
favicon = "assets/images/favicon/favicon.ico"

# Language
language = "en"

# Features - matching mkdocs.yml features
features = [
    # Announcement bar dismiss
    "announce.dismiss",

    # Code features
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",

    # Content features
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",

    # Navigation features
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",

    # Search features
    "search.highlight",
    "search.suggest",
    "search.share",

    # TOC features
    "toc.follow",
]

# Font configuration
[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# Icon configuration
[project.theme.icon]
repo = "fontawesome/brands/github"

# Color scheme - dark mode first (default)
[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# ----------------------------------------------------------------------------
# Social links
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/BA-CalderonMorales/my-life-as-a-dev"

# ----------------------------------------------------------------------------
# Markdown Extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions]
# Standard markdown extensions
extra = {}
def_list = {}
md_in_html = {}
meta = {}
attr_list = {}
admonition = {}

# PyMdown Extensions for enhanced code and content features
[project.markdown_extensions.pymdownx]
highlight = { anchor_linenums = true }
inlinehilite = {}
snippets = {}
extra = {}                             # Note: pymdownx.extra is different from markdown.extra above
details = {}

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "material.extensions.emoji.twemoji"
emoji_generator = "material.extensions.emoji.to_svg"

# ----------------------------------------------------------------------------
# Plugins Configuration
# ----------------------------------------------------------------------------
[project.plugins]

# Navigation plugin
[project.plugins.awesome-nav]

# Git authors plugin
[project.plugins.git-authors]
enabled = false           # Controlled by ENABLE_GIT_AUTHORS env var in CI
show_email_address = true
href = "mailto:{email}"

# Git revision date plugin
[project.plugins.git-revision-date-localized]
timezone = "America/North_Dakota/Center"

# Mike versioning plugin
[project.plugins.mike]

# Image zoom plugin
[project.plugins.panzoom]

# Lightbox plugin
[project.plugins.glightbox]

# Search plugin
[project.plugins.search]

# Tags plugin
[project.plugins.tags]

# Minify plugin
[project.plugins.minify]
minify_html = true
minify_js = true
minify_css = true

[project.plugins.minify.htmlmin_opts]
remove_comments = true

# Print site plugin
[project.plugins.print-site]
enabled = false # Controlled by ENABLE_PRINT_SITE env var in CI

# ----------------------------------------------------------------------------
# Watch Paths (for development hot reload)
# ----------------------------------------------------------------------------
[project.watch]
paths = ["mkdocs_plugins", "docs/overrides", "scripts/python"]
