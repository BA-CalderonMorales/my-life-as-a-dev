[project]
site_name = "Brandon A. Calderon Morales"
site_description = "Engineer and Marine veteran in Omaha, Nebraska."
site_author = "Brandon A. Calderon Morales"
site_url = "https://ba-calderonmorales.github.io/my-life-as-a-dev/"
copyright = "Copyright &copy; 2024-2026 Brandon A. Calderon Morales"
repo_url = "https://github.com/BA-CalderonMorales/my-life-as-a-dev"
repo_name = "BA-CalderonMorales/my-life-as-a-dev"
edit_uri = "edit/main/docs/"
extra_css = [
    "assets/css/theme.css",
]
nav = [
    { Home = "index.md" },
]

[project.theme]
favicon = "assets/images/favicon/favicon.ico"
language = "en"
features = [
    "content.code.annotate",
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.top",
]

[project.theme.font]
text = "Playpen Sans"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "black"
accent = "grey"

[project.theme.palette.toggle]
icon = "lucide/moon"
name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "grey"

[project.theme.palette.toggle]
icon = "lucide/sun"
name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/BA-CalderonMorales/my-life-as-a-dev"

[project.markdown_extensions.extra]

[project.markdown_extensions.def_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.meta]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.extra]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "material.extensions.emoji.twemoji"
emoji_generator = "material.extensions.emoji.to_svg"

[project.plugins.git-authors]
enabled = true
show_email_address = true
href = "mailto:{email}"

[project.plugins.git-revision-date-localized]
timezone = "America/North_Dakota/Center"

[project.watch]
paths = [
    "docs/**",
    "scripts/python",
]
