<!-- Share buttons component - inspired by HashiCorp Developer style -->
<!-- No counters/numbers since there's no database backend -->
<div class="share-actions" role="region" aria-label="Share this page">
  <span class="share-actions__label">Share</span>
  
  <div class="share-actions__buttons">
    <!-- Copy link button -->
    <button class="share-action share-action--copy" aria-label="Copy link to clipboard" title="Copy link">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span class="share-action__tooltip">Copied!</span>
    </button>

    <!-- Share on X/Twitter -->
    <a class="share-action share-action--twitter" href="#" aria-label="Share on X" title="Share on X" target="_blank" rel="noopener noreferrer">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </a>

    <!-- Share on LinkedIn -->
    <a class="share-action share-action--linkedin" href="#" aria-label="Share on LinkedIn" title="Share on LinkedIn" target="_blank" rel="noopener noreferrer">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
    </a>

    <!-- Native share (shown only when Web Share API is available) -->
    <button class="share-action share-action--native" aria-label="Share" title="Share" style="display: none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function() {
  // Initialize share functionality when DOM is ready
  function initShareActions() {
    const shareContainer = document.querySelector('.share-actions');
    if (!shareContainer) return;

    const pageUrl = window.location.href;
    const pageTitle = document.title;
    const encodedUrl = encodeURIComponent(pageUrl);
    const encodedTitle = encodeURIComponent(pageTitle);

    // Copy link button
    const copyBtn = shareContainer.querySelector('.share-action--copy');
    if (copyBtn) {
      copyBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        try {
          await navigator.clipboard.writeText(pageUrl);
          copyBtn.classList.add('share-action--copied');
          setTimeout(() => {
            copyBtn.classList.remove('share-action--copied');
          }, 2000);
        } catch (err) {
          // Fallback for older browsers that don't support clipboard API
          // Note: execCommand('copy') is deprecated but provides broad compatibility
          const textArea = document.createElement('textarea');
          textArea.value = pageUrl;
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          copyBtn.classList.add('share-action--copied');
          setTimeout(() => {
            copyBtn.classList.remove('share-action--copied');
          }, 2000);
        }
      });
    }

    // Twitter/X share link
    const twitterLink = shareContainer.querySelector('.share-action--twitter');
    if (twitterLink) {
      twitterLink.href = `https://x.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`;
    }

    // LinkedIn share link
    const linkedinLink = shareContainer.querySelector('.share-action--linkedin');
    if (linkedinLink) {
      linkedinLink.href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;
    }

    // Native share API (for mobile and modern browsers)
    const nativeShareBtn = shareContainer.querySelector('.share-action--native');
    if (nativeShareBtn && navigator.share) {
      nativeShareBtn.style.display = 'flex';
      nativeShareBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        try {
          await navigator.share({
            title: pageTitle,
            url: pageUrl
          });
        } catch (err) {
          // User cancelled or share failed - silent fail
        }
      });
    }
  }

  // Run on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initShareActions);
  } else {
    initShareActions();
  }

  // Re-initialize on navigation (for MkDocs Material instant loading)
  if (typeof document$ !== 'undefined') {
    document$.subscribe(initShareActions);
  }
})();
</script>
