name: Deploy to GitHub Pages

on:

  push:
    branches:
      - main
    paths-ignore:
      - '.devcontainer/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.cursorrules'
      - '.cursor/rules/**'
      - 'Makefile'
      - 'doc-cli'
      - 'doc-cli/**'
      - 'doc-cli.sh'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'

  pull_request:
    paths-ignore:
      - '.devcontainer/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.cursorrules'
      - '.cursor/rules/**'
      - 'Makefile'
      - 'doc-cli'
      - 'doc-cli/**'
      - 'doc-cli.sh'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.0). Leave empty for auto-increment.'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run e2e structure checks
        if: github.event_name == 'pull_request'
        run: |
          pip install pytest pytest-playwright
          playwright install chromium
          python -m pytest e2e/test_structure.py -v

      - name: Build site with Zensical
        run: |
          echo "Building site with Zensical..."
          zensical build
          echo "Build complete!"

          # Create .nojekyll to prevent GitHub Pages from ignoring files
          touch site/.nojekyll

          # Verify Three.js assets are included
          echo "Verifying Three.js assets in build..."
          if [ -d "site/assets/js/threejs-background" ]; then
            echo "✓ Three.js assets found in build"
            ls -la site/assets/js/threejs-background/
          else
            echo "✗ WARNING: Three.js assets NOT found in build!"
            find site/assets -type f -name "*.js" | head -20
          fi

          echo "Build output structure:"
          ls -la site/

      - name: Get version
        if: github.event_name != 'pull_request'
        id: version
        run: |
          # Use input version if provided, otherwise read from versions.json
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Read current version and increment patch
            if [ -f versions.json ]; then
              CURRENT=$(cat versions.json | python -c "import sys, json; v=json.load(sys.stdin); print(v['versions'][0]['version'] if v.get('versions') else '0.0.0')")
              # Increment patch version
              IFS='.' read -r major minor patch <<< "$CURRENT"
              VERSION="${major}.${minor}.$((patch + 1))"
            else
              VERSION="0.1.0"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Configure git
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        if: github.event_name != 'pull_request'
        run: |
          python scripts/python/versioned_deploy.py deploy \
            "${{ steps.version.outputs.version }}" \
            --alias latest \
            --push \
            --no-build

      - name: Output deployment URL
        if: github.event_name != 'pull_request'
        run: |
          echo "## Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://ba-calderonmorales.github.io/my-life-as-a-dev/" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned URL:** https://ba-calderonmorales.github.io/my-life-as-a-dev/${{ steps.version.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
