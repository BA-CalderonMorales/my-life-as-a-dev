name: Deploy to GitHub Pages

on:

  push:
    branches:
      - main
    paths-ignore:
      - '.devcontainer/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.cursorrules'
      - '.cursor/rules/**'
      - 'versions.json'
      - 'Makefile'
      - 'doc-cli'
      - 'doc-cli/**'
      - 'doc-cli.sh'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'

  pull_request:
    paths-ignore:
      - '.devcontainer/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.cursorrules'
      - '.cursor/rules/**'
      - 'versions.json'
      - 'Makefile'
      - 'doc-cli'
      - 'doc-cli/**'
      - 'doc-cli.sh'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            docs
            zensical.toml
            requirements.txt
            versions.json
            e2e

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zensical

      - name: Run e2e structure checks
        if: github.event_name == 'pull_request'
        run: |
          pip install pytest pytest-playwright
          playwright install chromium
          python -m pytest e2e/test_structure.py -v

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site with Zensical
        run: |
          echo "Building site with Zensical..."
          zensical build
          echo "Build complete!"
          
          # Create .nojekyll to prevent GitHub Pages from ignoring files
          touch site/.nojekyll
          
          # Show build output
          ls -la site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: build

    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy Preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true
